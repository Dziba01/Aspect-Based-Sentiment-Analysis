{% extends 'base.html' %}

{% block title %}Hotel Not Found{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <i class="fas fa-hotel fa-5x text-muted"></i>
                    </div>
                    <h1 class="display-5 fw-bold text-warning">Hotel Not Found</h1>
                    <p class="lead mb-4">We couldn't find the hotel you're looking for.</p>
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <strong>"{{ slug }}"</strong> is not a valid hotel.
                    </div>
                    <div class="mt-4">
                        <a href="/" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i> Go to Home
                        </a>
                        <a href="{% url 'core:hotel_login' %}" class="btn btn-outline-primary ms-2">
                            <i class="fas fa-sign-in-alt me-2"></i> Hotel Login
                        </a>
                    </div>
                    <hr class="my-4">
                    <p class="text-muted">
                        <i class="fas fa-qrcode me-1"></i>
                        Scan a valid QR code at any hotel to leave feedback.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
